<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ארגז הכלים - עוזר חכם לוועד הבית</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary:    #EA580C;
      --color-mid:        #F97316;
      --color-light:      #FED7AA;
      --color-deep:       #7C2D12;
      --color-cream:      #FFF7ED;
      --color-text-dark:  #1C0A00;
      --color-text-mid:   #92400E;
      --color-text-muted: #C2844B;
      --color-border:     #FDDCB5;
      --color-white:      #FFFFFF;

      --shadow-sm:  0 1px 3px rgba(124,45,18,0.08), 0 1px 2px rgba(124,45,18,0.04);
      --shadow-md:  0 4px 10px rgba(124,45,18,0.10), 0 2px 4px rgba(124,45,18,0.06);
      --shadow-xl:  0 20px 40px rgba(124,45,18,0.16), 0 8px 16px rgba(124,45,18,0.08);
      --shadow-glow: 0 0 0 3px rgba(234,88,12,0.15);

      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-lg:   18px;
      --radius-xl:   24px;
      --radius-full: 9999px;

      --font-display: 'Secular One', 'Assistant', Arial, sans-serif;
      --font-body:    'Assistant', Arial, sans-serif;

      --transition-fast:   140ms cubic-bezier(0.4,0,0.2,1);
      --transition-spring: 360ms cubic-bezier(0.16,1,0.3,1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--font-body);
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(249,115,22,0.12) 0%, transparent 70%),
        linear-gradient(160deg, #FFF0E0 0%, var(--color-cream) 40%, #FEF3E8 100%);
      color: var(--color-text-dark);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    ::-webkit-scrollbar               { width: 5px; }
    ::-webkit-scrollbar-track         { background: transparent; }
    ::-webkit-scrollbar-thumb         { background: var(--color-light); border-radius: var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover   { background: var(--color-mid); }

    .chat-container {
      width: 100%;
      max-width: 580px;
      height: 92vh;
      display: flex;
      flex-direction: column;
      background: var(--color-white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl), 0 0 0 1px rgba(234,88,12,0.08);
      overflow: hidden;
    }

    /* ── Header ── */
    .chat-header {
      background: linear-gradient(135deg, var(--color-deep) 0%, #9A3412 35%, var(--color-primary) 75%, var(--color-mid) 100%);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    .chat-header::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 18px),
        repeating-linear-gradient(45deg,  rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 18px);
      pointer-events: none;
    }
    .chat-header::after {
      content: '';
      position: absolute;
      top: -60px; left: -40px;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .header-inner {
      position: relative; z-index: 1;
      padding: 20px 24px 16px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .header-avatar { width: 52px; height: 52px; flex-shrink: 0; }
    .header-info   { flex: 1; min-width: 0; }
    .header-title {
      font-family: var(--font-display);
      font-size: 26px; font-weight: 400;
      color: var(--color-white);
      letter-spacing: 0.02em; line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header-subtitle {
      font-size: 13.5px; color: rgba(255,255,255,0.82);
      font-weight: 400; margin-top: 3px;
    }
    .header-badges { display: flex; gap: 7px; margin-top: 8px; flex-wrap: wrap; }
    .header-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--radius-full);
      padding: 3px 10px; font-size: 10.5px;
      color: rgba(255,255,255,0.9); font-weight: 600;
      backdrop-filter: blur(4px);
    }
    .header-badge::before {
      content: ''; width: 6px; height: 6px;
      background: #86EFAC; border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(134,239,172,0.3);
      animation: statusPulse 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    .header-gov-badge {
      display: inline-flex; align-items: center;
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius-sm);
      padding: 3px 9px; font-size: 10px;
      color: rgba(255,255,255,0.75); font-weight: 500;
    }
    @keyframes statusPulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(134,239,172,0.3); }
      50%       { box-shadow: 0 0 0 5px rgba(134,239,172,0.1); }
    }

    /* ── Category chips ── */
    .category-bar {
      background: linear-gradient(to bottom, rgba(124,45,18,0.05) 0%, transparent 100%);
      border-bottom: 1px solid var(--color-border);
      padding: 10px 16px 12px; flex-shrink: 0;
    }
    .category-bar-label {
      font-size: 10.5px; font-weight: 700;
      color: var(--color-text-mid);
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px;
    }
    .category-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .category-chip {
      background: var(--color-white);
      color: var(--color-primary);
      border: 1.5px solid var(--color-light);
      border-radius: var(--radius-full);
      padding: 5px 14px; font-size: 12.5px;
      font-family: var(--font-body); font-weight: 600;
      cursor: pointer; transition: all var(--transition-fast);
      white-space: nowrap; box-shadow: var(--shadow-sm); user-select: none;
    }
    .category-chip:hover {
      background: var(--color-light); border-color: var(--color-primary);
      color: var(--color-deep); box-shadow: var(--shadow-md); transform: translateY(-1px);
    }
    .category-chip:active, .category-chip.active {
      background: linear-gradient(135deg, var(--color-primary), var(--color-mid));
      border-color: var(--color-primary); color: var(--color-white);
      box-shadow: 0 2px 8px rgba(234,88,12,0.35); transform: translateY(0);
    }

    /* ── Messages ── */
    .messages-area {
      flex: 1; overflow-y: auto;
      padding: 24px 20px 16px;
      display: flex; flex-direction: column; gap: 4px;
      background:
        linear-gradient(rgba(253,220,181,0.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(253,220,181,0.22) 1px, transparent 1px),
        var(--color-cream);
      background-size: 28px 28px, 28px 28px;
      scroll-behavior: smooth;
    }
    .message-row {
      display: flex; align-items: flex-end; gap: 10px;
      animation: msgIn var(--transition-spring) both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .message-row.bot  { align-self: flex-start; max-width: 86%; }
    .message-row.user { align-self: flex-end;   max-width: 82%; flex-direction: row-reverse; }

    .bot-avatar {
      width: 34px; height: 34px; flex-shrink: 0;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--color-deep), var(--color-primary));
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-md); margin-bottom: 2px;
    }
    .bot-avatar svg { width: 20px; height: 20px; }

    .message-group { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .message-bubble {
      padding: 13px 17px; border-radius: var(--radius-lg);
      font-size: 14.5px; line-height: 1.7;
      word-wrap: break-word; overflow-wrap: break-word;
    }
    .message-row.bot .message-bubble {
      background: var(--color-white); color: var(--color-text-dark);
      border-right: 4px solid var(--color-primary);
      border-top-right-radius: 4px;
      box-shadow: var(--shadow-md), 0 0 0 1px rgba(234,88,12,0.06);
    }
    .message-row.user .message-bubble {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-mid) 100%);
      color: var(--color-white); border-top-left-radius: 4px;
      box-shadow: var(--shadow-md), 0 2px 12px rgba(234,88,12,0.28);
    }
    .message-time {
      font-size: 10.5px; color: var(--color-text-muted);
      padding: 0 5px; opacity: 0;
      transition: opacity var(--transition-fast);
    }
    .message-row:hover .message-time { opacity: 1; }
    .message-row.user .message-time  { text-align: left; }

    .message-bubble p             { margin: 0 0 9px 0; }
    .message-bubble p:last-child  { margin-bottom: 0; }
    .message-bubble strong        { font-weight: 700; }
    .message-bubble em            { font-style: italic; }
    .message-bubble ul,
    .message-bubble ol            { margin: 7px 0 9px 0; padding-right: 20px; padding-left: 0; }
    .message-bubble li            { margin-bottom: 4px; }
    .message-bubble hr            { border: none; border-top: 1.5px solid rgba(234,88,12,0.18); margin: 12px 0; }
    .message-row.user .message-bubble hr { border-top-color: rgba(255,255,255,0.3); }

    /* ── Suggestions ── */
    .suggestions-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 6px 0 4px 0;
      animation: msgIn var(--transition-spring) 80ms both;
    }
    .suggestions-label {
      width: 100%; font-size: 11px; font-weight: 700;
      color: var(--color-text-mid); letter-spacing: 0.05em; margin-bottom: 3px;
    }
    .suggestion-chip {
      background: rgba(254,215,170,0.35); color: var(--color-deep);
      border: 1.5px solid var(--color-light); border-radius: var(--radius-full);
      padding: 4px 12px; font-size: 12px;
      font-family: var(--font-body); font-weight: 600;
      cursor: pointer; transition: all var(--transition-fast);
      white-space: nowrap; user-select: none;
    }
    .suggestion-chip:hover {
      background: var(--color-light); border-color: var(--color-primary);
      color: var(--color-primary); transform: translateY(-1px); box-shadow: var(--shadow-sm);
    }

    /* ── Typing indicator ── */
    .typing-indicator {
      display: none; align-self: flex-start;
      align-items: flex-end; gap: 10px;
      animation: msgIn var(--transition-spring) both;
    }
    .typing-indicator.visible { display: flex; }
    .typing-bubble {
      background: var(--color-white); padding: 14px 18px;
      border-radius: var(--radius-lg); border-top-right-radius: 4px;
      border-right: 4px solid var(--color-primary);
      box-shadow: var(--shadow-md), 0 0 0 1px rgba(234,88,12,0.06);
      display: flex; gap: 5px; align-items: center;
    }
    .typing-dot {
      width: 7px; height: 7px; background: var(--color-primary);
      border-radius: 50%; animation: dotBounce 1.3s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.16s; }
    .typing-dot:nth-child(3) { animation-delay: 0.32s; }
    @keyframes dotBounce {
      0%, 60%, 100% { transform: translateY(0);   opacity: 0.4; }
      30%            { transform: translateY(-7px); opacity: 1; }
    }

    /* ── Date separator ── */
    .date-separator {
      display: flex; align-items: center; gap: 12px;
      margin: 8px 0 16px;
    }
    .date-separator::before, .date-separator::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(to left, var(--color-border), transparent);
    }
    .date-separator::after {
      background: linear-gradient(to right, var(--color-border), transparent);
    }
    .date-separator span {
      font-size: 11px; color: var(--color-text-muted);
      font-weight: 600; white-space: nowrap; letter-spacing: 0.04em;
    }

    /* ── Input area ── */
    .input-area {
      padding: 14px 20px 16px;
      background: var(--color-white);
      border-top: 1px solid var(--color-border);
      flex-shrink: 0;
      box-shadow: 0 -4px 20px rgba(124,45,18,0.06);
    }
    .input-wrapper {
      display: flex; align-items: center; gap: 10px;
      background: var(--color-cream);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-full);
      padding: 5px 5px 5px 16px;
      transition: all var(--transition-fast);
    }
    .input-wrapper:focus-within {
      border-color: var(--color-primary);
      box-shadow: var(--shadow-glow), var(--shadow-sm);
      background: var(--color-white);
    }
    .message-input {
      flex: 1; border: none; background: transparent;
      font-size: 14.5px; font-family: var(--font-body);
      color: var(--color-text-dark); outline: none;
      padding: 7px 0; direction: rtl; min-width: 0;
    }
    .message-input::placeholder { color: var(--color-text-muted); }
    .message-input:disabled      { opacity: 0.6; cursor: not-allowed; }
    .send-btn {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-mid));
      border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all var(--transition-fast);
      flex-shrink: 0; box-shadow: 0 2px 8px rgba(234,88,12,0.35);
    }
    .send-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--color-deep), var(--color-primary));
      box-shadow: 0 4px 14px rgba(234,88,12,0.45);
      transform: scale(1.06) translateY(-1px);
    }
    .send-btn:active:not(:disabled) { transform: scale(0.96); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
    .send-btn svg { width: 20px; height: 20px; fill: var(--color-white); }
    .input-hint {
      text-align: center; font-size: 10.5px;
      color: var(--color-text-muted); margin-top: 8px;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      body { align-items: stretch; background: var(--color-cream); }
      .chat-container { max-width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
      .header-inner  { padding: 16px 18px 13px; }
      .header-title  { font-size: 22px; }
      .messages-area { padding: 18px 14px 12px; }
      .category-bar  { padding: 8px 14px 10px; }
      .input-area    { padding: 12px 14px 14px; }
      .message-row.bot  { max-width: 94%; }
      .message-row.user { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="chat-container">

    <header class="chat-header" role="banner">
      <div class="header-inner">
        <div class="header-avatar" aria-hidden="true">
          <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="18" width="36" height="28" rx="2" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
            <path d="M4 20L26 5L48 20" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linejoin="round"/>
            <rect x="21" y="33" width="10" height="13" rx="2" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
            <rect x="11" y="23" width="7" height="6" rx="1.5" fill="rgba(255,220,100,0.55)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
            <rect x="34" y="23" width="7" height="6" rx="1.5" fill="rgba(255,220,100,0.55)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
            <rect x="11" y="32" width="7" height="6" rx="1.5" fill="rgba(255,220,100,0.35)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
            <rect x="34" y="32" width="7" height="6" rx="1.5" fill="rgba(255,220,100,0.35)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
            <circle cx="26" cy="12" r="3.5" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
          </svg>
        </div>
        <div class="header-info">
          <div class="header-title">ארגז הכלים</div>
          <div class="header-subtitle">עוזר חכם לוועד הבית</div>
          <div class="header-badges">
            <span class="header-badge">מחובר ופעיל</span>
            <span class="header-gov-badge">פועל על בסיס מדריך ממשלתי 2022</span>
          </div>
        </div>
      </div>
    </header>

    <nav class="category-bar" aria-label="קטגוריות נושאים">
      <div class="category-bar-label">נושאים מהירים</div>
      <div class="category-chips" id="categoryChips">
        <button class="category-chip" data-msg="מהו ועד הבית ומה תפקידו?">מהו ועד הבית</button>
        <button class="category-chip" data-msg="איך מקיימים אסיפת דיירים?">אסיפת דיירים</button>
        <button class="category-chip" data-msg="מהן חובות תחזוקת הבניין?">תחזוקת בניין</button>
        <button class="category-chip" data-msg="איזה ביטוח חייב ועד הבית?">ביטוח</button>
        <button class="category-chip" data-msg="כיצד קובעים דמי ועד?">דמי ועד</button>
        <button class="category-chip" data-msg="מהו רכוש משותף בבית משותף?">רכוש משותף</button>
        <button class="category-chip" data-msg="מה זה התחדשות עירונית?">התחדשות עירונית</button>
        <button class="category-chip" data-msg="כיצד פותרים סכסוכים בין דיירים?">פתרון סכסוכים</button>
      </div>
    </nav>

    <main class="messages-area" id="messagesArea" role="log" aria-live="polite">
      <div class="date-separator"><span>היום</span></div>
      <div class="message-row bot" id="welcomeRow">
        <div class="bot-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9L12 3L21 9V20C21 20.55 20.55 21 20 21H15V15H9V21H4C3.45 21 3 20.55 3 20V9Z" fill="rgba(255,255,255,0.9)"/>
          </svg>
        </div>
        <div class="message-group">
          <div class="message-bubble" id="welcomeBubble"></div>
          <div class="message-time" id="welcomeTime"></div>
        </div>
      </div>
      <div class="typing-indicator" id="typingIndicator" aria-label="ארגז הכלים מקליד...">
        <div class="bot-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9L12 3L21 9V20C21 20.55 20.55 21 20 21H15V15H9V21H4C3.45 21 3 20.55 3 20V9Z" fill="rgba(255,255,255,0.9)"/>
          </svg>
        </div>
        <div class="typing-bubble" aria-hidden="true">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </main>

    <footer class="input-area">
      <div class="input-wrapper">
        <input type="text" class="message-input" id="messageInput"
          placeholder="שאלו אותי כל שאלה על ניהול הבניין..."
          autocomplete="off" aria-label="הקלידו שאלה" maxlength="600">
        <button class="send-btn" id="sendBtn" title="שלח הודעה" aria-label="שלח">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 12L4 4L7.5 12L4 20L20 12Z"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">ארגז הכלים עשוי לטעות לפעמים &mdash; מומלץ לוודא מידע חשוב ממקורות רשמיים</p>
    </footer>
  </div>

  <script>
    var API_ENDPOINT = '/api/chat';
    var isWaiting = false;

    var WELCOME_TEXT =
      'שלום! אני **ארגז הכלים**, העוזר החכם שלכם לניהול ועד הבית.\n\n' +
      'אני מבוסס על **המדריך הממשלתי לבתים משותפים 2022** ויכול לסייע בנושאים כגון:\n\n' +
      '- תפקידי הנציגות וחובות חבריה\n' +
      '- ניהול אסיפות דיירים ותקנון\n' +
      '- תחזוקה, ביטוח ודמי ועד\n' +
      '- רכוש משותף והתחדשות עירונית\n' +
      '- יישוב מחלוקות ופנייה לגורמים רשמיים\n\n' +
      'בחרו נושא מלמעלה, או שאלו בחופשיות:';

    var messagesArea  = document.getElementById('messagesArea');
    var messageInput  = document.getElementById('messageInput');
    var sendBtn       = document.getElementById('sendBtn');
    var typingEl      = document.getElementById('typingIndicator');
    var welcomeBubble = document.getElementById('welcomeBubble');
    var welcomeTime   = document.getElementById('welcomeTime');
    var categoryChips = document.getElementById('categoryChips');

    function renderListBlock(text, regex, tag) {
      var lines = text.split('\n'), out = [], inList = false;
      for (var i = 0; i < lines.length; i++) {
        var m = lines[i].match(regex);
        if (m) {
          if (!inList) { out.push('<' + tag + '>'); inList = true; }
          out.push('<li>' + m[1] + '</li>');
        } else {
          if (inList) { out.push('</' + tag + '>'); inList = false; }
          out.push(lines[i]);
        }
      }
      if (inList) out.push('</' + tag + '>');
      return out.join('\n');
    }

    function renderMarkdown(raw) {
      var s = raw
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      s = s.replace(/^---$/gm, '<hr>');
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      s = renderListBlock(s, /^\d+\.\s+(.+)$/, 'ol');
      s = renderListBlock(s, /^[-•]\s+(.+)$/, 'ul');
      s = s.replace(/\n\n+/g, '</p><p>');
      s = s.replace(/\n/g, '<br>');
      s = '<p>' + s + '</p>';
      s = s.replace(/<p>\s*<\/p>/g, '');
      return s;
    }

    function fmtTime(d) {
      return d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    }

    function botAvatarHTML() {
      return '<div class="bot-avatar" aria-hidden="true">' +
        '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M3 9L12 3L21 9V20C21 20.55 20.55 21 20 21H15V15H9V21H4C3.45 21 3 20.55 3 20V9Z" fill="rgba(255,255,255,0.9)"/>' +
        '</svg></div>';
    }

    function addBotMessage(text, suggestions) {
      var row = document.createElement('div');
      row.className = 'message-row bot';
      var group = document.createElement('div');
      group.className = 'message-group';
      var bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerHTML = renderMarkdown(text);
      var timeEl = document.createElement('div');
      timeEl.className = 'message-time';
      timeEl.textContent = fmtTime(new Date());
      group.appendChild(bubble);
      group.appendChild(timeEl);
      if (suggestions && suggestions.length > 0) {
        var sugRow = document.createElement('div');
        sugRow.className = 'suggestions-row';
        var label = document.createElement('div');
        label.className = 'suggestions-label';
        label.textContent = 'שאלות קשורות:';
        sugRow.appendChild(label);
        suggestions.forEach(function(sug) {
          var chip = document.createElement('button');
          chip.className = 'suggestion-chip';
          chip.textContent = sug;
          chip.addEventListener('click', function() { sendMessage(sug); });
          sugRow.appendChild(chip);
        });
        group.appendChild(sugRow);
      }
      row.innerHTML = botAvatarHTML();
      row.appendChild(group);
      messagesArea.insertBefore(row, typingEl);
      scrollBottom();
    }

    function addUserMessage(text) {
      var row = document.createElement('div');
      row.className = 'message-row user';
      var group = document.createElement('div');
      group.className = 'message-group';
      var bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerHTML = renderMarkdown(text);
      var timeEl = document.createElement('div');
      timeEl.className = 'message-time';
      timeEl.textContent = fmtTime(new Date());
      group.appendChild(bubble);
      group.appendChild(timeEl);
      row.appendChild(group);
      messagesArea.insertBefore(row, typingEl);
      scrollBottom();
    }

    function scrollBottom() {
      requestAnimationFrame(function() {
        messagesArea.scrollTo({ top: messagesArea.scrollHeight, behavior: 'smooth' });
      });
    }

    function showTyping() { typingEl.classList.add('visible'); scrollBottom(); }
    function hideTyping() { typingEl.classList.remove('visible'); }

    function delay(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

    async function sendMessage(text) {
      text = (text || '').trim();
      if (!text || isWaiting) return;
      messageInput.value = '';
      messageInput.focus();
      addUserMessage(text);
      isWaiting = true;
      sendBtn.disabled = true;
      messageInput.disabled = true;
      showTyping();
      try {
        var res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        hideTyping();
        await delay(180);
        var reply = data.response || 'מצטער, לא קיבלתי תשובה מהשרת.';
        var suggestions = Array.isArray(data.suggestions) ? data.suggestions : [];
        addBotMessage(reply, suggestions);
      } catch (err) {
        hideTyping();
        console.error('[ToolBox] Chat error:', err);
        addBotMessage('מצטער, אירעה שגיאה בתקשורת עם השרת.\nאנא בדקו את החיבור ונסו שנית.', []);
      } finally {
        isWaiting = false;
        sendBtn.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
      }
    }

    sendBtn.addEventListener('click', function() { sendMessage(messageInput.value); });
    messageInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(messageInput.value); }
    });
    categoryChips.addEventListener('click', function(e) {
      var chip = e.target.closest('.category-chip');
      if (!chip) return;
      document.querySelectorAll('.category-chip').forEach(function(c) { c.classList.remove('active'); });
      chip.classList.add('active');
      var msg = chip.getAttribute('data-msg');
      if (msg) sendMessage(msg);
    });

    welcomeBubble.innerHTML = renderMarkdown(WELCOME_TEXT);
    welcomeTime.textContent = fmtTime(new Date());
    messageInput.focus();
    scrollBottom();
  </script>
</body>
</html>
