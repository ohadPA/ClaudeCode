server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # SPA routing — all paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|woff2|woff|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
