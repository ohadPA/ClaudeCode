<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow ChatBot</title>
  <style>
    /* --- Reset & Base --- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- Chat Container --- */
    .chat-container {
      width: 460px;
      max-width: 100vw;
      height: 700px;
      max-height: 95vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- Header --- */
    .chat-header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header .logo {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }

    .chat-header .info h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .chat-header .info p {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    /* --- Messages Area --- */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

    /* --- Message Bubbles --- */
    .message {
      display: flex;
      gap: 10px;
      max-width: 90%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.bot { align-self: flex-start; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .message .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.bot .avatar {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
    }

    .message.user .avatar {
      background: #e5e7eb;
      color: #6b7280;
    }

    .message .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.bot .bubble {
      background: #f3f4f6;
      border-bottom-left-radius: 4px;
    }

    .message.user .bubble {
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* --- Rendered Markdown inside bot bubbles --- */
    .bubble strong { font-weight: 600; }

    .bubble .md-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 12px;
    }
    .bubble .md-table th,
    .bubble .md-table td {
      border: 1px solid #d1d5db;
      padding: 4px 8px;
      text-align: left;
    }
    .bubble .md-table th {
      background: #e5e7eb;
      font-weight: 600;
    }

    .bubble ul, .bubble ol {
      padding-left: 18px;
      margin: 4px 0;
    }

    .bubble li { margin: 2px 0; }

    .bubble p { margin: 6px 0; }
    .bubble p:first-child { margin-top: 0; }
    .bubble p:last-child { margin-bottom: 0; }

    /* --- Typing Indicator --- */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 0 20px;
    }

    .typing-indicator.visible { display: flex; }

    .typing-indicator .dots {
      display: flex;
      gap: 4px;
      align-items: center;
      background: #f3f4f6;
      padding: 12px 16px;
      border-radius: 16px;
      margin-left: 42px;
    }

    .typing-indicator .dot {
      width: 8px;
      height: 8px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-indicator .dot:nth-child(1) { animation-delay: 0s; }
    .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* --- Input Area --- */
    .chat-input {
      padding: 16px 20px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
      background: #fff;
    }

    .chat-input input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 24px;
      padding: 12px 20px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input input:focus { border-color: #4f46e5; }

    .chat-input button {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .chat-input button:hover { background: #4338ca; }
    .chat-input button:disabled { background: #a5b4fc; cursor: not-allowed; }

    .chat-input button svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* --- Quick Actions --- */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 20px 12px;
    }

    .quick-action {
      background: #eef2ff;
      color: #4f46e5;
      border: 1px solid #c7d2fe;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-action:hover {
      background: #4f46e5;
      color: #fff;
      border-color: #4f46e5;
    }

    /* --- Responsive --- */
    @media (max-width: 480px) {
      .chat-container {
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
      <div class="logo">TF</div>
      <div class="info">
        <h1>TaskFlow Assistant</h1>
        <p><span class="status-dot"></span>Online - Ask me anything</p>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="messages">
      <!-- Welcome message injected by JS -->
    </div>

    <!-- Typing indicator -->
    <div class="typing-indicator" id="typing">
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- Quick action buttons -->
    <div class="quick-actions" id="quickActions">
      <button class="quick-action" data-msg="What is TaskFlow?">What is TaskFlow?</button>
      <button class="quick-action" data-msg="Features">Features</button>
      <button class="quick-action" data-msg="Pricing">Pricing</button>
      <button class="quick-action" data-msg="Integrations">Integrations</button>
      <button class="quick-action" data-msg="Get started">Get started</button>
    </div>

    <!-- Input -->
    <div class="chat-input">
      <input type="text" id="input" placeholder="Ask about TaskFlow..." autocomplete="off">
      <button id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const typingEl = document.getElementById("typing");
    const quickActionsEl = document.getElementById("quickActions");

    /**
     * Render basic markdown-like formatting to HTML.
     * Supports: **bold**, bullet lists (- item), numbered lists, tables, line breaks.
     */
    function renderMarkdown(text) {
      // Split into lines
      const lines = text.split("\n");
      let html = "";
      let inList = false;
      let inTable = false;
      let tableRows = [];

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // Skip table separator rows (|---|---|)
        if (/^\|[\s\-:|]+\|$/.test(line.trim())) continue;

        // Table rows
        if (line.trim().startsWith("|") && line.trim().endsWith("|")) {
          if (!inTable) {
            inTable = true;
            tableRows = [];
          }
          tableRows.push(line.trim());
          // Check if next line is NOT a table row
          const nextLine = lines[i + 1];
          if (!nextLine || (!nextLine.trim().startsWith("|") && !/^\|[\s\-:|]+\|$/.test(nextLine.trim()))) {
            html += renderTable(tableRows);
            inTable = false;
            tableRows = [];
          }
          continue;
        }

        // Close list if we're no longer in one
        if (inList && !line.match(/^[\s]*[-*]\s/) && !line.match(/^[\s]*\d+\.\s/) && line.trim() !== "") {
          html += "</ul>";
          inList = false;
        }

        // Bullet list items
        if (line.match(/^[\s]*[-*]\s/)) {
          if (!inList) { html += "<ul>"; inList = true; }
          let content = line.replace(/^[\s]*[-*]\s/, "");
          html += "<li>" + formatInline(content) + "</li>";
          continue;
        }

        // Numbered list items
        if (line.match(/^[\s]*\d+\.\s/)) {
          if (!inList) { html += "<ul>"; inList = true; }
          let content = line.replace(/^[\s]*\d+\.\s/, "");
          html += "<li>" + formatInline(content) + "</li>";
          continue;
        }

        // Empty line = paragraph break
        if (line.trim() === "") {
          if (inList) { html += "</ul>"; inList = false; }
          html += "<br>";
          continue;
        }

        // Regular text
        html += "<p>" + formatInline(line) + "</p>";
      }

      if (inList) html += "</ul>";
      return html;
    }

    /**
     * Format inline markdown: **bold**, `code`, links.
     */
    function formatInline(text) {
      // Bold: **text**
      text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      // Code: `text`
      text = text.replace(/`(.+?)`/g, '<code style="background:#e5e7eb;padding:1px 4px;border-radius:3px;font-size:12px;">$1</code>');
      return text;
    }

    /**
     * Render a markdown table to an HTML table.
     */
    function renderTable(rows) {
      if (rows.length === 0) return "";
      let html = '<table class="md-table">';
      rows.forEach((row, idx) => {
        const cells = row.split("|").filter(c => c.trim() !== "");
        const tag = idx === 0 ? "th" : "td";
        html += "<tr>";
        cells.forEach(cell => {
          html += `<${tag}>${formatInline(cell.trim())}</${tag}>`;
        });
        html += "</tr>";
      });
      html += "</table>";
      return html;
    }

    /**
     * Add a message to the chat.
     */
    function addMessage(text, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${sender}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = sender === "bot" ? "TF" : "You"[0];

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (sender === "bot") {
        bubble.innerHTML = renderMarkdown(text);
      } else {
        bubble.textContent = text;
      }

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);
      messagesEl.appendChild(msgDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    /**
     * Send a message to the chatbot API and display the response.
     */
    async function sendMessage(text) {
      if (!text.trim()) return;

      // Display user message
      addMessage(text, "user");
      inputEl.value = "";
      sendBtn.disabled = true;

      // Show typing indicator
      typingEl.classList.add("visible");
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();

        // Simulate slight delay for natural feel
        await new Promise((r) => setTimeout(r, 600));

        typingEl.classList.remove("visible");
        addMessage(data.response || "Sorry, something went wrong.", "bot");
      } catch (err) {
        typingEl.classList.remove("visible");
        addMessage("Connection error. Make sure the server is running.", "bot");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    // --- Event Listeners ---
    sendBtn.addEventListener("click", () => sendMessage(inputEl.value));

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage(inputEl.value);
    });

    // Quick action buttons
    quickActionsEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".quick-action");
      if (btn) sendMessage(btn.dataset.msg);
    });

    // --- Welcome message on load ---
    addMessage(
      "Hi! I'm the **TaskFlow Assistant**. I can help you learn about our product, features, pricing, and more.\n\nTry one of the quick actions below, or just type your question!",
      "bot"
    );
  </script>
</body>
</html>
